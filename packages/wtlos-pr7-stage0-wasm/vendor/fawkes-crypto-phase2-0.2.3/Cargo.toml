[package]
name = "fawkes-crypto-phase2"
version = "0.2.3"
authors = ["Sean Bowe <ewillbefull@gmail.com>"]
description = "Library for performing MPCs for creating zk-SNARK public parameters"
documentation = "https://docs.rs/fawkes_crypto_phase2"
homepage = "https://github.com/zeropoolnetwork/phase2-bn254"
license = "MIT/Apache-2.0"
repository = "https://github.com/zeropoolnetwork/phase2-bn254"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
rand = "0.4"
byteorder = "1"
exitcode = "1.1.2"
blake2-rfc = "0.2"
blake2 = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.2.3"
num-traits = "0.2.8"
itertools = "0.9.0"
hex = "0.4.0"
cfg-if = "0.1.10"

# needed for native only but don't break wasm if present
num_cpus = "1"
crossbeam = "0.7.3"

# needed for wasm only
wasm-bindgen = { version = "0.2.58", optional = true }
js-sys = { version = "0.3.35", optional = true }
web-sys = { version = "0.3.35", features = ["console"], optional = true }
console_error_panic_hook = { version = "0.1.6", optional = true }

[features]
default = ["rust-crypto"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook", "bellman_ce/wasm"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bellman_ce = { package = "fawkes-crypto-zkbob-bellman_ce", version="0.4.0", git = "https://github.com/zkBob/phase2-bn254", branch = "master", default-features = false, features = ["multicore"] }
rust-crypto = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bellman_ce = { package = "fawkes-crypto-zkbob-bellman_ce", version="0.4.0", git = "https://github.com/zkBob/phase2-bn254", branch = "master", default-features = false, features = ["wasm"] }
